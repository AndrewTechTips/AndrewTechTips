<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Andrei Condrea — Full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2760f" stop-opacity="0"/>
      <stop offset="25%" stop-color="#c2760f"/>
      <stop offset="75%" stop-color="#e2561f"/>
      <stop offset="100%" stop-color="#e2561f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#c2760f" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c2760f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="88%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <g stroke="#c2760f" stroke-opacity="0.07" stroke-width="1">
    <path d="M60 0V300M180 0V300M300 0V300M420 0V300M540 0V300M660 0V300M780 0V300M900 0V300M1020 0V300M1140 0V300"/>
    <path d="M0 75H1200M0 150H1200M0 225H1200"/>
  </g>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g fill="#c2760f">
    <circle cx="150" cy="70" r="1.8" opacity="0.5">
      <animate attributeName="cy" values="70;54;70" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1045" cy="212" r="2.2" opacity="0.4">
      <animate attributeName="cy" values="212;230;212" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="995" cy="66" r="1.5" opacity="0.35">
      <animate attributeName="cy" values="66;80;66" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="205" cy="228" r="1.6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.65;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="600" y="132" font-size="66" fill="#14181d" letter-spacing="1.5" opacity="1">
      Andrei Condrea
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.15s" fill="freeze"/>
    </text>
  </g>

  <rect x="370" y="158" width="460" height="2" rx="1" fill="url(#rule)">
    <animate attributeName="width" values="0;460" dur="1.1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <animate attributeName="x" values="600;370" dur="1.1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </rect>

  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="600" y="199" font-size="19" fill="#5a6873" letter-spacing="3.4" opacity="1">
      FULL-STACK DEVELOPER · COMPUTER SCIENCE STUDENT
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.15s" fill="freeze"/>
    </text>
    <text x="600" y="243" font-size="15" fill="#76838f" letter-spacing="0.6" opacity="1">
      Python · FastAPI · PostgreSQL · vanilla JavaScript · Docker
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.5s" fill="freeze"/>
    </text>
    <text x="600" y="276" font-size="13" fill="#96a2ad" letter-spacing="1.8" opacity="1">
      CONSTANȚA, ROMANIA
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.8s" fill="freeze"/>
    </text>
  </g>

  <rect width="1200" height="300" fill="url(#fade)"/>
</svg>
